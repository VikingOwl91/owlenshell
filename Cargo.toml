[package]
name = "owlenshell"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
slint = { version = "1.17", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
smithay-client-toolkit = "0.21"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
thiserror = "2"

[build-dependencies]
slint-build = "1.17"

[profile.dev]
opt-level = 1
